[project]
name = "metadata-provider"
version = "1.0.0"
description = "Template for building Plex Custom Metadata Providers (movie/tv/music)"
requires-python = ">=3.11"

[tool.docker]
image = "<username>/<image-name>"
# Docker Hub truncates short descriptions at 100 characters
short_description = "A Plex-compatible Metadata Provider for FanEdit Movies"

[tool.pytest.ini_options]
testpaths = ["tests"]
